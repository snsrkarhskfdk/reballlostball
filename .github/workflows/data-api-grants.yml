name: Data API grants
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/db/data-api-grants/**'
      - 'scripts/test-data-api-grants.mjs'
      - 'package*.json'
      - '.github/workflows/data-api-grants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-grants-test
          POSTGRES_DB: reball_grants_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:sql
      - run: npm run test:db:grants
        env:
          REBALL_GRANTS_TEST_URL: postgresql://postgres:local-grants-test@127.0.0.1:5432/reball_grants_ci

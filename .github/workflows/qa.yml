name: Full QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and release contract on Windows
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/frontend/release-closure.test.mjs tests/frontend/public-config.test.mjs tests/frontend/admin-shipping-publication.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:edge
          exit $LASTEXITCODE
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Release static smoke
        run: npm run test:release
      - name: Legacy entrypoint check
        run: npm run check:legacy
      - name: Edge function typecheck
        run: npm run check:edge
      - name: SQL validation
        run: npm run check:sql
      - name: Unit tests
        run: npm run test:unit
      - name: Contract tests
        run: npm run test:integration
      - name: E2E tests
        run: npm run test:e2e
      - name: Accessibility tests
        run: npm run test:a11y

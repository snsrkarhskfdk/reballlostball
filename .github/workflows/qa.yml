name: Full QA

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Legacy entrypoint check
        run: npm run check:legacy
      - name: Edge function typecheck
        run: npm run check:edge
      - name: SQL validation
        run: npm run check:sql
      - name: Unit tests
        run: npm run test:unit
      - name: Contract tests
        run: npm run test:integration
      - name: E2E tests
        run: npm run test:e2e
      - name: Accessibility tests
        run: npm run test:a11y
